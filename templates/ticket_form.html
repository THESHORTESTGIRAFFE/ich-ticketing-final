{% extends "layout.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex items-center gap-3 mb-8">
        <a href="{{ url_for('dashboard') }}" class="p-2 bg-white rounded-xl shadow-sm border border-gray-100 text-gray-500 hover:text-blue-600 transition-colors">
            <i class="hgi-stroke hgi-arrow-left-01 w-5 h-5"></i>
        </a>
        <h1 class="text-3xl font-bold tracking-tight text-gray-900">New Ticket</h1>
    </div>

    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
        <form method="POST" action="{{ url_for('new_ticket') }}" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Issue Title</label>
                <input type="text" name="title" required 
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm font-medium"
                       placeholder="Summarize the issue">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Priority</label>
                <select name="priority" required
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm font-medium text-gray-700">
                    <option value="LOW">Low - Not urgent</option>
                    <option value="MEDIUM" selected>Medium - Normal priority</option>
                    <option value="HIGH">High - Urgent / Blocking work</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Detailed Description</label>
                <textarea name="description" rows="5" required 
                          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm font-medium resize-none"
                          placeholder="Please provide details about the problem..."></textarea>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex justify-center items-center gap-2">
                    Submit Ticket
                    <i class="hgi-stroke hgi-sent-01 h-4 w-4"></i>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
