{% extends "layout.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center gap-3 mb-8">
        <a href="{{ url_for('dashboard') }}" class="p-2 bg-white rounded-xl shadow-sm border border-gray-100 text-gray-500 hover:text-blue-600 transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <h1 class="text-3xl font-bold tracking-tight text-gray-900">Office Management</h1>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="md:col-span-2 bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h2 class="text-lg font-bold text-gray-900">Registered Offices</h2>
            </div>
            <div class="overflow-x-auto px-6 pb-6">
                <table class="w-full text-left border-collapse datatable">
                    <thead>
                        <tr class="text-xs font-semibold text-gray-500 uppercase tracking-wider bg-white border-b border-gray-100">
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Office Name</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        {% for office in offices %}
                        <tr class="hover:bg-gray-50/80 transition-colors">
                            <td class="px-6 py-4 font-mono text-xs text-gray-400">#{{ office.id[:8] }}</td>
                            <td class="px-6 py-4 font-semibold text-gray-900">{{ office.name }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

        <div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-bold text-gray-900 mb-4">Add New Office</h3>
                <form method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Office Name</label>
                        <input type="text" name="name" required 
                               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm font-medium"
                               placeholder="e.g. Legal Department">
                    </div>
                    <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex justify-center items-center gap-2">
                        Add Office
                        <i data-lucide="plus" class="h-4 w-4"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
