{% extends "layout.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <!-- Banner above the card -->
    <div class="text-center mb-8">
        <img src="{{ url_for('static', filename='logo_banner.png') }}" alt="ICH Logo Banner"
             class="h-20 w-auto object-contain mx-auto">
    </div>

    <div class="bg-white p-8 rounded-3xl shadow-xl shadow-blue-900/5 border border-gray-100">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Welcome Back</h2>
            <p class="text-sm text-gray-500 mt-1 font-medium">Log in to manage IT support tickets</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="hgi-stroke hgi-mail-01 h-5 w-5 text-gray-400"></i>
                    </div>
                    <input type="email" name="email" required
                           class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm font-medium"
                           placeholder="Enter your email">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="hgi-stroke hgi-lock-password h-5 w-5 text-gray-400"></i>
                    </div>
                    <input type="password" name="password" required
                           class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm font-medium"
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex justify-center items-center gap-2">
                Sign In
                <i class="hgi-stroke hgi-arrow-right-01 h-4 w-4"></i>
            </button>
        </form>

        <p class="mt-8 text-center text-sm font-medium text-gray-500">
            Don't have an account?
            <a href="{{ url_for('register') }}" class="text-blue-600 hover:text-blue-700 hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
